<!DOCTYPE html>
<html lang="nl" data-theme="sporthub" data-sport="beker" style="--sport-icoon:url('/sport/beker-klein.webp');--sport-icoon-groot:url('/sport/beker.webp');--werk-icoon:url('/sport/werk/fluit-klein.webp');--werk-icoon-groot:url('/sport/werk/fluit.webp')">
<head>
  <script src="/voorbeeld.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Wedstrijdbediening — JVO Sportdag</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="manifest" href="/wedstrijd.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/crew-192.png" />
  <meta name="theme-color" content="#06193A" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JVO Wedstrijd" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/jvo-smart.css" />
  <style>
    body.wd { background: var(--midnight); }
    .wd-shell { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
    .wd-top { display: flex; align-items: center; gap: 12px; padding: 4px 2px 16px; flex-wrap: wrap; }
    .wd-top .t { min-width: 0; }
    /* het ECHTE JVO-logo als merkteken (tekst blijft als SR-label, visueel verborgen) */
    .wd-badge { width: 38px; height: 38px; border-radius: 50%; background: url('/jvo-logo.jpg') center/cover, var(--midnight); display: flex; align-items: center; justify-content: center; color: transparent; font-size: 0; flex: none; }
    .wd-top .t { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice-muted); }
    .wd-top .t b { display: block; color: var(--ice); font-size: 13px; }
    .wd-checkin { margin-left: auto; color: var(--gold-2); font-family: var(--body); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 600; text-decoration: none; }
    .wd-logout { margin-left: 16px; background: none; border: none; color: var(--ice-muted); font-family: var(--body); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 600; cursor: pointer; }
    .wd-logout:hover, .wd-checkin:hover { color: var(--ice); }
    /* JVO Smart (net-crew-04): altijd-zichtbare sync-status zodat de crew nooit vals vertrouwen krijgt bij offline */
    .wd-sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; line-height: 1; }
    .wd-sync .d { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
    .wd-sync.ok { color: var(--success); background: rgba(108,227,160,.12); }
    .wd-sync.pending { color: var(--gold); background: rgba(255,179,71,.15); }
    .wd-sync.off { color: var(--ice-muted); background: rgba(232,244,255,.08); }
    .wd-sync.wd-hidden { display: none; }
    /* JVO Smart (net-crew-01): verkeerde-wedstrijd-poort vóór de eerste start */
    .wd-verify { background: rgba(255,107,26,.08); border: 1px solid rgba(255,107,26,.34); border-radius: 14px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .wd-verify-h { font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: .01em; color: var(--ember-2, #FF8A4C); }
    .wd-verify-m { font-size: 18px; line-height: 1.35; color: var(--ice); }
    .wd-verify-m b { color: var(--gold-2); }
    .wd-verify #wd-verify-ok { width: 100%; }

    .wd-login { background: var(--midnight-2); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-top: 30px; }
    .wd-login h2 { font-family: var(--display); text-transform: uppercase; font-size: 24px; color: var(--ice); margin-bottom: 4px; }

    /* match list — lege staten gebruiken nu <jvo-empty> (JVO Motion) */

    /* status filter chips */
    .wd-filter { position: sticky; top: 0; z-index: 5; display: flex; gap: 7px; padding: 8px 0 12px; margin-bottom: 4px; background: linear-gradient(var(--midnight) 70%, transparent); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .wd-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; background: var(--midnight-2); border: 1px solid var(--line-strong); color: var(--ice-muted); border-radius: 22px; padding: 9px 14px; font-family: var(--body); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease, color .15s ease; }
    .wd-chip.on { background: rgba(255,179,71,.16); color: var(--gold-2); border-color: rgba(255,179,71,.45); font-weight: 700; }
    .wd-chip i { font-style: normal; background: rgba(232,244,255,.1); color: var(--ice); border-radius: 10px; padding: 1px 7px; font-size: 11px; }
    .wd-chip.on i { background: var(--gold); color: var(--midnight); }

    .wd-group-h { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ember); margin: 18px 2px 10px; }
    .wd-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 4px; }
    @media (min-width: 520px) { .wd-grid { grid-template-columns: 1fr 1fr; } }
    .wd-match { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; background: var(--midnight-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; cursor: pointer; transition: border-color .15s, transform .1s; }
    .wd-match:active { transform: scale(.99); }
    .wd-m-time { font-family: var(--display); font-weight: 900; font-size: 19px; color: var(--gold-2); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .wd-m-time .wd-exp { display: block; font-family: var(--mono); font-size: 10px; font-weight: 400; color: var(--gold); margin-top: 3px; }
    .wd-match.done .wd-m-time { color: var(--ice-faint); }
    .wd-match.live { border-color: rgba(108,227,160,.5); background: rgba(108,227,160,.06); }
    .wd-match.locked { opacity: .5; cursor: default; filter: grayscale(1); }
    .wd-match.locked:active { transform: none; }
    .wd-match .teams { font-size: 15px; color: var(--ice); min-width: 0; overflow-wrap: break-word; line-height: 1.3; }
    .wd-match .teams .v { color: var(--ice-faint); font-family: var(--mono); font-size: 12px; margin: 0 6px; }
    .wd-match .teams .ctx { font-family: var(--mono); font-size: 10px; color: var(--ice-faint); letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
    .wd-match .right { text-align: right; flex: none; }
    .wd-match .scwrap { margin-top: 6px; }
    .wd-match .sc { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--gold-2); }
    .wd-pill { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; display: inline-block; }
    .wd-pill.sched { background: rgba(232,244,255,.08); color: var(--ice-muted); }
    .wd-pill.live { background: rgba(108,227,160,.18); color: var(--success); border: 1px solid rgba(108,227,160,.4); animation: wdpulse 1.6s infinite; }
    .wd-pill.done { background: rgba(255,179,71,.14); color: var(--gold-2); }
    @keyframes wdpulse { 50% { opacity: .55; } }

    /* veld filter (second chip row) */
    .wd-vfilter { display: flex; gap: 7px; padding: 0 0 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .wd-vchip { flex: 0 0 auto; background: var(--midnight-2); border: 1px solid var(--line-strong); color: var(--ice-muted); border-radius: 22px; padding: 8px 13px; font-family: var(--body); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease, color .15s ease; }
    .wd-vchip.on { background: rgba(255,179,71,.16); color: var(--gold-2); border-color: rgba(255,179,71,.45); font-weight: 700; }

    /* NU LIVE — broadcast cards, one tap to control */
    .wd-now-h { display: flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--success); margin: 6px 2px 10px; }
    .wd-now-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(108,227,160,.6); animation: wdpulse2 1.6s infinite; }
    @keyframes wdpulse2 { 0%{box-shadow:0 0 0 0 rgba(108,227,160,.5);} 70%{box-shadow:0 0 0 8px rgba(108,227,160,0);} 100%{box-shadow:0 0 0 0 rgba(108,227,160,0);} }
    .wd-now-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
    @media (min-width: 520px) { .wd-now-grid { grid-template-columns: 1fr 1fr; } }
    .wd-now { position: relative; overflow: hidden; border-radius: 16px; padding: 14px 16px 16px; cursor: pointer;
      background: rgba(108,227,160,.08);
      border: 1px solid rgba(108,227,160,.45); box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); transition: transform .1s, border-color .15s ease; }
    .wd-now:active { transform: scale(.99); }
    .wd-now.locked { opacity: .6; cursor: default; }
    .wd-now-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .wd-now-field { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--midnight); background: var(--success); border-radius: 5px; padding: 3px 8px; font-weight: 700; flex: none; }
    .wd-now-ctx { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ice-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wd-now-clk { margin-left: auto; font-family: var(--display); font-weight: 900; font-size: 19px; color: var(--ice); flex: none; font-variant-numeric: tabular-nums; }
    .wd-now-clk.extra { color: var(--danger); animation: wdblink 1s infinite; }
    .wd-now-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
    .wd-now-team { font-size: 15px; font-weight: 600; color: var(--ice); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wd-now-body .wd-now-team:first-child { text-align: right; }
    .wd-now-sc { display: inline-flex; align-items: baseline; gap: 4px; font-family: var(--display); font-weight: 900; flex: none; }
    .wd-now-sc b { font-size: 30px; color: var(--ice); line-height: 1; font-variant-numeric: tabular-nums; }
    .wd-now-sc i { font-size: 17px; color: var(--ice-faint); font-style: normal; position: relative; top: -2px; }
    .wd-now-cta { margin-top: 12px; text-align: center; font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--success); font-weight: 700; }
    .wd-now.locked .wd-now-cta { color: var(--ice-faint); font-weight: 400; }

    /* control view */
    .wd-back { background: none; border: none; color: var(--gold-2); font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; padding: 4px 0 14px; }
    .wd-ctx { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice-muted); margin-bottom: 14px; }
    /* control header — field badge + context + live pill */
    .wd-c-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; padding: 11px 13px; border-radius: 12px; background: var(--midnight-2); border: 1px solid var(--line); }
    .wd-c-head.live { border-color: rgba(108,227,160,.4); background: rgba(108,227,160,.06); }
    .wd-c-field { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--midnight); background: var(--gold); border-radius: 5px; padding: 4px 9px; font-weight: 700; flex: none; }
    .wd-c-head.live .wd-c-field { background: var(--success); }
    .wd-c-ctx { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ice-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wd-c-pill { margin-left: auto; flex: none; font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; }
    .wd-c-pill.live { background: rgba(108,227,160,.18); color: var(--success); border: 1px solid rgba(108,227,160,.4); animation: wdpulse 1.6s infinite; }
    .wd-c-pill.done { background: rgba(255,179,71,.14); color: var(--gold-2); }
    .wd-c-pill.sched { background: rgba(232,244,255,.08); color: var(--ice-muted); }
    .wd-board { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
    .wd-team { background: var(--midnight-2); border: 1px solid var(--line); border-radius: 16px; padding: 16px 12px; text-align: center; }
    .wd-team .nm { font-size: 15px; color: var(--ice); font-weight: 600; min-height: 38px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
    .wd-team .num { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; color: var(--gold-2); margin: 4px 0 10px; }
    /* Walkover (no-show) */
    .wd-noshow-btn { margin-top: 10px; width: 100%; background: none; border: 1px dashed var(--line-strong, rgba(232,244,255,.18)); border-radius: 10px; color: var(--ice-muted); font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; padding: 10px; cursor: pointer; }
    .wd-noshow-btn:hover { color: var(--ice); border-color: var(--ice-faint); }
    .wd-noshow { margin-top: 8px; background: var(--midnight-2); border: 1px solid rgba(255,138,61,.4); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .wd-noshow .t { font-size: 13.5px; color: var(--ice); font-weight: 600; margin-bottom: 2px; }
    .wd-noshow .wd-noshow-pick { text-align: left; padding: 12px 14px; font-size: 14px; }
    .wd-noshow .wd-noshow-pick b { color: var(--gold-2); }
    .wd-team .num.bump { animation: wdbump .4s; }
    @keyframes wdbump { 0%{transform:scale(1);} 40%{transform:scale(1.35); color:var(--success);} 100%{transform:scale(1);} }
    .wd-plus { width: 100%; padding: 18px 0; border: none; border-radius: 12px; background: var(--gold); color: var(--midnight); font-family: var(--display); font-weight: 900; font-size: 24px; cursor: pointer; transition: background .12s ease; }
    .wd-plus:hover { background: var(--gold-2); }
    .wd-plus:active { filter: brightness(.92); }
    .wd-minus { margin-top: 8px; width: 100%; padding: 9px 0; border: 1px solid var(--line-strong, rgba(232,244,255,.18)); border-radius: 10px; background: transparent; color: var(--ice-muted); font-family: var(--mono); font-size: 13px; cursor: pointer; }
    .wd-mid { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 18px; min-width: 96px; }
    .wd-timer { font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--ice); letter-spacing: .02em; }
    .wd-timer.extra { color: var(--danger); animation: wdblink 1s infinite; }
    @keyframes wdblink { 50% { opacity: .4; } }
    .wd-timer-lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice-faint); margin-top: 4px; }
    .wd-timer.extra + .wd-timer-lbl { color: var(--danger); }
    .wd-vs { font-family: var(--mono); color: var(--ice-faint); font-size: 12px; margin-top: 10px; }

    /* pending buffer */
    .wd-pending { margin-top: 16px; background: rgba(255,179,71,.1); border: 1px solid rgba(255,179,71,.35); border-radius: 12px; padding: 14px 16px; display: none; }
    .wd-pending.show { display: block; }
    .wd-pending .row { display: flex; align-items: center; gap: 10px; }
    .wd-pending .msg { font-size: 14px; color: var(--ice); flex: 1; }
    .wd-pending .msg b { color: var(--gold-2); }
    .wd-pending .cnt { font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--gold); }
    .wd-pending-warn { margin-top: 9px; padding: 9px 11px; border-radius: 9px; background: rgba(255,107,26,.12); border: 1px solid rgba(255,107,26,.34); border-left: 3px solid var(--ember, #FF6B1A); color: var(--ice, #E8F4FF); font-size: 13px; line-height: 1.4; }
    .wd-pending-warn b { color: var(--ember-2, #FF8A4C); }
    @media (prefers-reduced-motion: no-preference) {
      .wd-pending-warn { animation: wd-warn-in .34s cubic-bezier(.16,1,.3,1) both, wd-warn-flash 1.5s ease-out .18s 1; }
      @keyframes wd-warn-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
      @keyframes wd-warn-flash { 0%, 100% { background: rgba(255,107,26,.12); border-left-color: var(--ember, #FF6B1A); } 32% { background: rgba(255,107,26,.26); border-left-color: #FFB37A; } }
    }
    .wd-pending .bar { height: 4px; background: rgba(255,179,71,.2); border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .wd-pending .bar i { display: block; height: 100%; background: var(--gold); width: 100%; }
    .wd-pending .acts { display: flex; gap: 8px; margin-top: 12px; }
    .wd-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--midnight-3); color: var(--ice); font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; }
    .wd-btn.go { background: var(--gold); color: var(--midnight); border: 1px solid transparent; font-weight: 700; }
    .wd-btn.go.start { background: var(--success); color: var(--midnight); }
    .wd-btn.go.end { background: var(--gold); color: var(--midnight); }

    /* penalty shoot-out entry */
    .wd-pens { margin-top: 16px; background: rgba(255,179,71,.07); border: 1px solid rgba(255,179,71,.32); border-radius: 14px; padding: 16px; display: none; }
    .wd-pens.show { display: block; }
    .wd-pens-h { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-2); text-align: center; margin-bottom: 14px; }
    .wd-pens-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
    .wd-pens-team { text-align: center; }
    .wd-pens-team .nm { font-size: 14px; color: var(--ice); font-weight: 600; min-height: 34px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
    .wd-pens-step { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
    .wd-pens-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong, rgba(232,244,255,.18)); background: var(--midnight); color: var(--ice); font-family: var(--display); font-weight: 900; font-size: 22px; cursor: pointer; line-height: 1; }
    .wd-pens-btn:active { filter: brightness(.85); }
    .wd-pens-step .val { font-family: var(--display); font-weight: 900; font-size: 34px; color: var(--gold-2); min-width: 34px; text-align: center; }
    .wd-pens-x { font-family: var(--mono); color: var(--ice-faint); font-size: 14px; align-self: center; padding-top: 26px; }
    .wd-pens-warn { color: var(--danger); font-size: 12px; text-align: center; min-height: 16px; margin-top: 10px; }
    .wd-pens-acts { display: flex; gap: 8px; margin-top: 6px; }

    .wd-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .wd-big { width: 100%; padding: 18px; border-radius: 14px; border: none; font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 11px; }
    .wd-big svg { width: 20px; height: 20px; flex: none; }
    .wd-big.start { background: var(--success); color: var(--midnight); }
    .wd-big.end { background: rgba(255,100,100,.16); color: #FF8484; border: 1px solid rgba(255,100,100,.45); }
    .wd-big.correct { background: var(--midnight-2); color: var(--ice-muted); border: 1px solid var(--line); }
    .wd-note { font-size: 12px; color: var(--ice-faint); text-align: center; margin-top: 4px; }
    .wd-hidden { display: none !important; }

    /* inline help trigger (top) */
    .wd-help-inline { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 12px 14px; border-radius: 12px; cursor: pointer;
      background: rgba(255,179,71,.07); border: 1px solid rgba(255,179,71,.28); color: var(--gold-2);
      font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; }
    .wd-help-inline svg { width: 18px; height: 18px; flex: none; }
    .wd-help-inline b { color: var(--ice); font-weight: 600; }
    .wd-help-inline .ar { margin-left: auto; color: var(--ice-faint); }
    .wd-help-inline:active { filter: brightness(1.1); }

    /* floating info button — always reachable */
    .wd-fab { position: fixed; right: 16px; bottom: 16px; z-index: 40; width: 54px; height: 54px; border-radius: 50%; cursor: pointer;
      background: var(--midnight-3); color: var(--gold-2); border: 1px solid rgba(255,179,71,.4);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; }
    .wd-fab:hover { background: #20406e; }
    .wd-fab svg { width: 27px; height: 27px; }
    .wd-fab:active { transform: scale(.93); }
    @media (min-width: 592px) { .wd-fab { right: calc(50% - 280px + 8px); } }

    /* bottom sheet (context help + install guide) */
    .wd-sheet { position: fixed; inset: 0; z-index: 50; display: none; }
    .wd-sheet.show { display: block; }
    .wd-sheet-bd { position: absolute; inset: 0; background: rgba(4,9,18,.68); }
    .wd-sheet-card { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
      background: var(--midnight-2); border: 1px solid var(--line); border-radius: 20px 20px 0 0;
      padding: 6px 18px max(22px, env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-shadow: 0 -22px 60px rgba(0,0,0,.55); animation: wdsheet .22s ease; }
    @keyframes wdsheet { from { transform: translateY(34px); opacity: 0; } }
    .wd-sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: rgba(232,244,255,.2); margin: 8px auto 8px; }
    .wd-sheet-head { display: flex; align-items: center; gap: 11px; margin: 2px 0 14px; }
    .wd-sheet-ic { width: 36px; height: 36px; border-radius: 11px; background: rgba(255,179,71,.14); border: 1px solid rgba(255,179,71,.3); display: flex; align-items: center; justify-content: center; flex: none; color: var(--gold-2); }
    .wd-sheet-ic svg { width: 19px; height: 19px; }
    .wd-sheet-title { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 21px; color: var(--ice); line-height: 1.02; }
    .wd-sheet-sub { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ice-faint); margin-top: 4px; }
    .wd-sheet-x { margin-left: auto; background: none; border: none; color: var(--ice-faint); font-size: 28px; line-height: 1; cursor: pointer; padding: 2px 8px; flex: none; }
    .wd-sheet-body { color: var(--ice); font-size: 15px; line-height: 1.5; }
    .wd-sheet-body p { margin: 0 0 11px; color: var(--ice-muted); }
    .wd-sheet-body p.lead { color: var(--ice); }
    .wd-sheet-body b { color: var(--ice); font-weight: 600; }
    .wd-sheet-body .hl { color: var(--gold-2); font-weight: 600; }
    .wd-sheet-body ul { list-style: none; padding: 0; margin: 0 0 6px; }
    .wd-sheet-body li { position: relative; padding: 8px 0 8px 24px; border-bottom: 1px solid rgba(232,244,255,.06); color: var(--ice); }
    .wd-sheet-body li:last-child { border-bottom: none; }
    .wd-sheet-body li::before { content: ''; position: absolute; left: 3px; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .wd-step { display: flex; gap: 13px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid rgba(232,244,255,.06); }
    .wd-step:last-child { border-bottom: none; }
    .wd-step-n { flex: none; width: 25px; height: 25px; border-radius: 50%; background: var(--gold); color: var(--midnight); font-family: var(--display); font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .wd-step-t { font-size: 15px; color: var(--ice); line-height: 1.4; }
    .wd-kbd { display: inline-block; background: rgba(232,244,255,.1); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-family: var(--mono); font-size: 12px; color: var(--ice); }
    .wd-sheet-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .wd-sheet-foot:empty { display: none; }
    .wd-sheet-install { width: 100%; padding: 13px; border-radius: 12px; border: 1px solid rgba(255,179,71,.4); background: rgba(255,179,71,.1); color: var(--gold-2);
      font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .wd-sheet-install svg { width: 16px; height: 16px; }
    .wd-sheet-cta { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--gold); color: var(--midnight);
      font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 16px; cursor: pointer; }
    .wd-sheet-cta:hover { background: var(--gold-2); }
    .wd-sheet-ghost { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: transparent; color: var(--ice-muted); font-family: var(--body); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 600; cursor: pointer; }

    /* ── Sport-hub: sportkeuze + bediening van de andere sporten (wedstrijd-hub.js) ── */
    .wh-sport { margin: 4px 0 14px; }
    .wh-sport[hidden], #wd-hub[hidden] { display: none; }
    .wh-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice-muted); margin: 0 0 8px; }
    .wh-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .wh-chips::-webkit-scrollbar { display: none; }
    .wh-chip { flex: none; display: inline-flex; align-items: center; gap: 7px; background: var(--midnight-2); border: 1px solid var(--line-strong); color: var(--ice); border-radius: 22px; padding: 6px 14px 6px 7px; font: 600 14px var(--body); cursor: pointer; min-height: 42px; }
    .wh-chip img { width: 26px; height: 26px; object-fit: contain; }
    .wh-chip[aria-selected="true"] { background: var(--ice); color: var(--midnight); border-color: var(--ice); }
    body.hub-mode #wd-list, body.hub-mode #wd-control, body.hub-mode #wd-smart, body.hub-mode #wd-paused { display: none !important; }
    .wh-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 12px; }
    .wh-head img { width: 44px; height: 44px; object-fit: contain; }
    .wh-head b { display: block; color: var(--ice); font-size: 18px; }
    .wh-head span { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ice-muted); }
    .wh-sec { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice-muted); margin: 18px 0 8px; }
    .wh-m { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; text-align: left; background: var(--midnight-2); border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px; color: var(--ice); font: inherit; cursor: pointer; margin-bottom: 8px; }
    .wh-m.live { border-color: var(--gold); }
    .wh-m .tm { font-family: var(--mono); font-size: 13px; color: var(--ice-muted); }
    .wh-m .tt { min-width: 0; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
    .wh-m .tt small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ice-faint); margin-top: 3px; }
    .wh-m .sc { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
    .wh-note { color: var(--ice-muted); font-size: 14px; line-height: 1.5; padding: 10px 0; }
    .wh-paused { padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,138,61,.5); background: rgba(255,138,61,.12); color: var(--ice); font-size: 14px; margin-bottom: 10px; }
    .wh-back { background: none; border: none; color: var(--ice-muted); font: 600 14px var(--body); cursor: pointer; padding: 8px 0; }
    .wh-card { background: var(--midnight-2); border: 1px solid var(--line-strong); border-radius: 14px; padding: 16px; margin-top: 8px; }
    .wh-ctx { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ice-muted); }
    .wh-team { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-top: 12px; }
    .wh-team .nm { font-size: 17px; font-weight: 600; color: var(--ice); min-width: 0; overflow-wrap: anywhere; }
    .wh-step { display: inline-flex; align-items: center; gap: 8px; }
    .wh-step b { min-width: 44px; text-align: center; font-size: 30px; color: var(--ice); font-variant-numeric: tabular-nums; }
    .wh-step button { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--midnight); color: var(--ice); font-size: 24px; font-weight: 700; cursor: pointer; }
    .wh-sets { margin-top: 14px; font-family: var(--mono); font-size: 13px; color: var(--ice-muted); }
    .wh-setrow { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 8px; align-items: center; margin-top: 8px; }
    .wh-setrow label { font-family: var(--mono); font-size: 11px; color: var(--ice-muted); text-transform: uppercase; letter-spacing: .08em; }
    .wh-setrow input, .wh-pens input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--midnight); color: var(--ice); font-size: 17px; text-align: center; }
    .wh-pens { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .wh-pens label { grid-column: 1 / -1; font-size: 14px; color: var(--ice); }
    .wh-actions { display: grid; gap: 8px; margin-top: 16px; }
    .wh-alert { margin-top: 12px; color: #FFB4A8; font-size: 14px; min-height: 1em; }
    .wh-m:focus-visible, .wh-chip:focus-visible, .wh-step button:focus-visible, .wh-back:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
  </style>
  <link rel="stylesheet" href="/thema-sporthub.css" />
  <link rel="stylesheet" href="/thema-sporthub-beheer.css" />
</head>
<body class="wd">
  <div class="wd-shell">
    <div class="wd-top">
      <div class="wd-badge">JVO</div>
      <div class="t">Crew · zijlijn<b>Wedstrijdbediening</b></div>
      <a class="wd-checkin" id="wd-checkin" href="/checkin.html" target="_blank" rel="noopener">Check-in ↗</a>
      <span class="wd-sync wd-hidden" id="wd-sync" role="status" aria-live="polite"></span>
      <button class="wd-logout wd-hidden" id="wd-logout">Uitloggen</button>
    </div>

    <button class="wd-help-inline" id="wd-help-inline" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.15" fill="currentColor" stroke="none"/></svg>
      <span><b>Hoe werkt dit?</b> — uitleg voor dit scherm</span>
      <span class="ar">›</span>
    </button>

    <!-- LOGIN -->
    <div class="wd-login wd-hidden" id="wd-login">
      <div class="card-eyebrow">Crew-toegang</div>
      <h2>Inloggen</h2>
      <div class="field"><label for="wd-name">Jouw naam</label><input type="text" id="wd-name" autocomplete="off" placeholder="Bijv. Sam" /></div>
      <div class="field"><label for="wd-code">Crew-code</label><input type="password" id="wd-code" autocomplete="off" /></div>
      <div id="wd-login-alert"></div>
      <button class="btn full" id="wd-login-btn" style="margin-top:12px;">Inloggen →</button>
    </div>

    <!-- PAUSE BANNER (shown when the admin paused the tournament) -->
    <div id="wd-paused" hidden style="margin:12px 0; padding:16px 18px; background:rgba(255,138,61,0.12); border:1px solid rgba(255,138,61,0.5); border-radius:12px; color:var(--ice);">
      <div style="display:flex; align-items:center; gap:9px; font-size:17px; font-weight:800; letter-spacing:.01em; color:var(--ember-2);"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>Toernooi gepauzeerd</div>
      <div style="font-size:14px; margin-top:5px; line-height:1.5; color:var(--ice-muted);">De organisatie heeft het toernooi even stilgezet. Je kunt nu geen wedstrijden starten of standen aanpassen. Wacht tot het hervat wordt.</div>
    </div>

    <!-- SPORT-HUB: sportkeuze (alleen bij meer dan één sport) + bediening van de
         andere sporten (wedstrijd-hub.js). Het hoofdtoernooi blijft hieronder. -->
    <div id="wd-sport" class="wh-sport" hidden>
      <div class="wh-lbl" id="wh-sport-lbl">Sport</div>
      <div class="wh-chips" id="wd-sport-chips" role="tablist" aria-labelledby="wh-sport-lbl"></div>
    </div>
    <div id="wd-hub" hidden></div>

    <!-- MATCH LIST -->
    <div id="wd-smart" class="jvs jvs-crew" hidden></div>
    <div id="wd-list" class="wd-hidden"></div>

    <!-- CONTROL -->
    <div id="wd-control" class="wd-hidden"></div>
  </div>

  <!-- Floating info button — always reachable, explains the current screen -->
  <button class="wd-fab" id="wd-help-fab" type="button" aria-label="Uitleg — hoe werkt dit scherm?">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.15" fill="currentColor" stroke="none"/></svg>
  </button>

  <!-- Help / install bottom sheet (filled by wedstrijd.js) -->
  <div class="wd-sheet" id="wd-sheet" role="dialog" aria-modal="true" aria-label="Uitleg">
    <div class="wd-sheet-bd" id="wd-sheet-bd"></div>
    <div class="wd-sheet-card">
      <div class="wd-sheet-grip"></div>
      <div class="wd-sheet-head">
        <div class="wd-sheet-ic" id="wd-sheet-ic"></div>
        <div style="min-width:0;">
          <div class="wd-sheet-title" id="wd-sheet-title"></div>
          <div class="wd-sheet-sub" id="wd-sheet-sub"></div>
        </div>
        <button class="wd-sheet-x" id="wd-sheet-x" type="button" aria-label="Sluiten">×</button>
      </div>
      <div class="wd-sheet-body" id="wd-sheet-body"></div>
      <div class="wd-sheet-foot" id="wd-sheet-foot"></div>
    </div>
  </div>

  <script src="/offline-ui.js"></script>
  <script src="/register-sw.js"></script>
  <script src="/fx.js"></script>
  <script src="/jvo-motion.js" defer></script>
  <script src="/wedstrijd.js"></script>
  <script src="/wedstrijd-hub.js"></script>
</body>
</html>
