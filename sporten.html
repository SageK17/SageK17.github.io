<!DOCTYPE html>
<html lang="nl" data-theme="sporthub">
<head>
  <meta name="robots" content="noindex, nofollow">
  <script src="/voorbeeld.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nu bezig — JVO Sportdag</title>
  <meta name="description" content="Alle sporten van de JVO Sportdag live: wat er nu gespeeld wordt, wat er straks komt en de standen." />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <meta name="theme-color" content="#06193A" />
  <!-- Eén web-app voor de deelnemer: Mijn team (/mijn) en dit bord onder één icoon (zie /mijn.webmanifest in server.js). -->
  <link rel="manifest" href="/mijn.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/jvo-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sportdag" />
  <link rel="stylesheet" href="/fonts.css" />
  <!-- De ballen in de ring rechtsboven draaien (WebGL, sh-bal3d.js); dat script werkt alleen in de stijl sporthub.
       Bewust: deze pagina staat NIET in THEMED_PAGES (server.js) — ze heeft eigen, page-scoped opmaak en mag
       thema-sporthub.css niet laden. Daarom zet ze data-theme hierboven zelf (via de vlag themeSporthub);
       sh-bal3d.js kijkt naar dat attribuut. data-sport en de sport-icoon-variabelen zijn hier niet nodig. -->
  <script src="/sh-bal3d.js" defer></script>
  <!-- Sport-hub live-bord (stijl Sporthub): "Nu bezig" over alle sporten heen.
       Eigen, page-scoped opmaak. De kleuren en de ronde letter komen uit de
       --sh-*-tokens van thema-sporthub.css waar dat thema geladen is; de waarde
       erachter is dezelfde, zodat de pagina er zonder het thema precies zo uitziet. -->
  <style>
    :root {
      --navy: var(--sh-navy, #06193A); --navy-2: var(--sh-navy-2, #0D2550); --wit: var(--sh-wit, #F6F7FB);
      --oranje: var(--sh-oranje, #FF6B1A); --rood: var(--sh-rood, #C4382E); --rood-l: var(--sh-rood-l, #F0685E);
      --inkt-2: var(--sh-inkt-2, #4A4F72);
      --rand: var(--sh-rand, rgba(255,255,255,.4)); --scheur: var(--sh-scheur, rgba(6,25,58,.3));
      --rond: var(--sh-rond, 'Unbounded', 'Geist', system-ui, sans-serif);
      --body: 'Geist', system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--navy); color: #fff; }
    body { font-family: var(--body); min-height: 100vh; overflow-x: hidden; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 6px; }
    .mono { font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 18px 16px calc(48px + 74px + env(safe-area-inset-bottom)); overflow: hidden; }
    /* kop: logo-regel, titel, telregel — met rechts de rode ring en daarin het icoon
       (bij "Alles" wisselen de sporten elkaar rustig af, bij één sport het icoon van die sport).
       De ring staat ónder de Live-pil en bóven de sportkiezer en past altijd helemaal in beeld. */
    .hoofd { position: relative; min-height: calc(46px + var(--ring)); --ring: 104px; }
    .ring { position: absolute; right: 0; top: 46px; width: var(--ring); height: var(--ring); border-radius: 50%; border: 2px solid var(--rood);
      background: radial-gradient(circle at 50% 38%, var(--navy-2), var(--navy) 72%); pointer-events: none; }
    .ring-in { position: absolute; inset: 15%; }
    .ring-in[hidden] { display: none; }
    .ring-in img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
    .ring-in img.op { opacity: 1; }
    @media (max-width: 359px) { .hoofd { --ring: 88px; } }
    .bar { position: relative; display: flex; align-items: center; gap: 10px; z-index: 2; }
    .bar img { width: 34px; height: 34px; border-radius: 50%; }
    .bar .nm { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.85); }
    .bar .nm b { color: #fff; }
    .pill { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      padding: 6px 11px; border-radius: 999px; font-weight: 600; background: #fff; color: var(--navy); text-decoration: none; white-space: nowrap; }
    .pill.live { background: var(--oranje); color: var(--navy); }
    .pill[hidden] { display: none; }
    h1 { position: relative; font-family: var(--rond); font-weight: 900; font-size: clamp(30px, 10vw, 44px); line-height: 1; letter-spacing: -.02em; margin-top: 34px; z-index: 2; margin-right: calc(var(--ring) + 8px); }
    h1 em, h2 em { font-style: normal; color: var(--oranje); }
    .sub { font-size: 10px; color: rgba(255,255,255,.85); margin-top: 12px; margin-right: calc(var(--ring) + 8px); line-height: 1.5; }
    .tabs { display: flex; gap: 8px; margin: 16px -16px 0; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 2; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 7px; border: 1.5px solid var(--rand); border-radius: 999px; padding: 5px 14px 5px 6px;
      font: 600 13px var(--body); white-space: nowrap; background: var(--navy-2); color: #fff; cursor: pointer; flex: none; min-height: 40px; }
    .tab img { width: 26px; height: 26px; object-fit: contain; }
    .tab.alles { padding: 9px 18px; }
    .tab[aria-selected="true"] { background: #fff; color: var(--navy); border-color: #fff; }
    .lbl { font-size: 10px; color: #fff; display: flex; align-items: center; gap: 10px; margin: 28px 0 10px; }
    .lbl::before { content: ''; width: 22px; height: 1.5px; background: var(--rood-l); }
    .list { display: grid; gap: 12px; }
    .badge { border-radius: 50%; background: var(--navy); box-shadow: 0 0 0 1.5px var(--navy), 0 0 0 3px var(--rood);
      display: flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 46px; }
    .badge img { width: 72%; height: 72%; object-fit: contain; }
    /* het kaartje: wit, met een strookje rechts (icoon in de ring + plek) */
    .kaart { --stub: 84px; background: #fff; color: var(--navy); border-radius: 16px; display: grid; grid-template-columns: 1fr var(--stub);
      -webkit-mask: radial-gradient(circle 9px at calc(100% - var(--stub)) 0, #0000 98%, #000) top/100% 51% no-repeat,
                    radial-gradient(circle 9px at calc(100% - var(--stub)) 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
              mask: radial-gradient(circle 9px at calc(100% - var(--stub)) 0, #0000 98%, #000) top/100% 51% no-repeat,
                    radial-gradient(circle 9px at calc(100% - var(--stub)) 100%, #0000 98%, #000) bottom/100% 51% no-repeat; }
    .kaart .l { padding: 12px 14px 11px; border-right: 2px dashed var(--scheur); min-width: 0; }
    .kaart .r { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 8px 4px; }
    .kaart .r span { font-size: 9px; color: var(--inkt-2); text-align: center; }
    .k { font-size: 9px; color: var(--inkt-2); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
    .k em { font-style: normal; background: var(--oranje); color: var(--navy); padding: 2px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .k em.klaar { background: var(--navy); color: #fff; }
    .tm { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-top: 6px; font-weight: 600; font-size: 15px; }
    /* lange namen: twee regels, breken op woordgrens of met een afbreekstreepje (lang=nl) */
    .tm span { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; white-space: normal; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; line-height: 1.22; }
    .tm b { font-family: var(--rond); font-weight: 900; font-size: 22px; line-height: 1.15; }
    .tm.win span { text-decoration: underline; text-decoration-color: var(--oranje); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .sets { margin-top: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--inkt-2); }
    .sr { display: grid; grid-template-columns: 54px 28px 1fr auto; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.22); font-size: 14px; font-weight: 500; }
    .sr b { font-family: var(--rond); font-weight: 700; font-size: 13px; }
    .sr img { width: 26px; height: 26px; object-fit: contain; }
    .sr span { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; white-space: normal; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; line-height: 1.25; }
    .sr i { font-style: normal; font-size: 9px; color: rgba(255,255,255,.85); }
    .leeg { border: 1.5px dashed var(--rand); border-radius: 16px; padding: 18px; font-size: 14px; color: rgba(255,255,255,.88); line-height: 1.5; }
    .stand { background: #fff; color: var(--navy); border-radius: 18px; padding: 12px 16px 8px; }
    .standen { display: grid; gap: 12px; }
    /* poule-kiezer: "Alle poules" staat altijd vooraan, je zit nooit vast op één poule */
    .poules { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .poules + .sportvlak .lbl:first-child, .poules + .sportvlak > section:first-child .lbl { margin-top: 18px; }
    .pchip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--rand); background: var(--navy-2); color: #fff; font: 600 13px var(--body); cursor: pointer; white-space: nowrap; }
    .pchip[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }
    /* "Sporten" op het overzicht: per sport hoeveel poules en deelnemers, en of er gespeeld wordt */
    .sporten { display: grid; gap: 10px; }
    .sportrij { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--navy-2); color: #fff;
      border: 1.5px solid var(--rand); border-radius: 16px; padding: 10px 14px 10px 10px; cursor: pointer; font: inherit; min-height: 68px; }
    .sportrij b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sportrij i { display: block; font-style: normal; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.85); margin-top: 4px; line-height: 1.5; }
    .sportrij em { font-style: normal; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; padding: 4px 9px; border-radius: 999px; white-space: nowrap; border: 1.5px solid var(--rand); color: #fff; }
    .sportrij em.live { background: var(--oranje); border-color: var(--oranje); color: var(--navy); }
    .stand h3 { font-family: var(--rond); font-weight: 900; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; text-transform: uppercase; }
    .stand h3 i { font-style: normal; font-family: var(--mono); font-size: 9px; letter-spacing: .14em; color: var(--inkt-2); font-weight: 500; }
    .srow { display: grid; grid-template-columns: 22px 1fr 30px 38px 34px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(6,25,58,.14); font-size: 14px; font-weight: 600; }
    .srow:first-of-type { margin-top: 8px; }
    .srow.kop { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--inkt-2); font-weight: 500; text-transform: uppercase; border-top: 0; padding-bottom: 2px; }
    .srow span { font-family: var(--mono); font-size: 11px; color: var(--inkt-2); font-weight: 500; }
    .srow .n { text-align: right; }
    .srow b { font-family: var(--rond); font-weight: 900; font-size: 15px; text-align: right; }
    .srow em { font-style: normal; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; white-space: normal; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; line-height: 1.22; }
    .podium { display: grid; gap: 8px; }
    .plek { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; background: var(--navy-2); border: 1.5px solid var(--rand); border-radius: 16px; padding: 10px 14px; }
    .plek b { font-family: var(--rond); font-weight: 900; font-size: 20px; color: var(--oranje); }
    .plek.p1 { background: #fff; color: var(--navy); border-color: #fff; box-shadow: 0 0 0 3px var(--oranje); }
    .plek.p1 b { color: var(--navy); }
    .plek span { font-weight: 600; font-size: 15px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; white-space: normal; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; hyphenate-limit-chars: 10 4 4; -webkit-hyphenate-limit-before: 4; -webkit-hyphenate-limit-after: 4; line-height: 1.22; }
    .meer { display: inline-flex; margin-top: 16px; font-size: 14px; font-weight: 600; text-underline-offset: 3px; }
    .voet { margin-top: 36px; font-size: 12px; color: rgba(255,255,255,.75); }
    /* jouw team: een rustig merkje (blauw op oranje = 5,9:1; nooit wit op oranje) */
    .k em.mijn { background: none; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--oranje); }
    .sr.mijn span { text-decoration: underline; text-decoration-color: var(--oranje); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .srow.mijn em { text-decoration: underline; text-decoration-color: var(--oranje); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    /* pauzemelding per sport */
    .pauze { margin-top: 22px; border: 1.5px solid var(--oranje); border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 1.5; color: #fff; background: var(--navy-2); }
    .pauze b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--oranje); margin-bottom: 4px; font-weight: 600; }
    .pauze + div, .pauze + .list { margin-top: 12px !important; }
    /* volg-balk: dichtgeklapt één regel, open de teamkiezer + meldingen */
    .volg { position: relative; z-index: 2; margin-top: 16px; border: 1.5px solid var(--rand); border-radius: 16px; background: var(--navy-2); }
    .volg[hidden] { display: none; }
    .volg summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 11px 14px; min-height: 46px; font-weight: 600; font-size: 14px; border-radius: 14px; }
    .volg summary::-webkit-details-marker { display: none; }
    .volg summary svg { width: 18px; height: 18px; flex: none; }
    .volg summary .st { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.85); text-align: right; }
    .volg summary .st.aan { color: var(--oranje); }
    .volg .in { padding: 2px 14px 14px; display: grid; gap: 10px; }
    .volg p { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.88); }
    .volg select { width: 100%; min-height: 46px; border-radius: 12px; border: 1.5px solid var(--rand); background: var(--navy); color: #fff; font: 600 15px var(--body); padding: 0 12px; }
    .volg-lijst { display: flex; flex-wrap: wrap; gap: 8px; }
    .volg-lijst:empty { display: none; }
    .volg-chip { display: inline-flex; align-items: center; gap: 4px; background: #fff; color: var(--navy); border-radius: 999px; padding: 0 4px 0 12px; font-weight: 600; font-size: 13.5px; min-height: 36px; max-width: 100%; }
    .volg-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .volg-chip small { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--inkt-2); white-space: nowrap; }
    .volg-chip button { border: 0; background: none; color: var(--navy); font-size: 20px; line-height: 1; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; flex: none; }
    .volg-chip button:focus-visible { outline-color: var(--navy); outline-offset: -3px; }
    .knop { min-height: 46px; border-radius: 999px; border: 1.5px solid #fff; background: #fff; color: var(--navy); font: 700 14.5px var(--body); padding: 0 18px; cursor: pointer; }
    .knop.rustig { background: transparent; color: #fff; border-color: var(--rand); }
    .knop[disabled] { opacity: .6; cursor: default; }
    .knop[hidden] { display: none; }
    .volg.wijs { box-shadow: 0 0 0 3px var(--oranje); }
    /* teamlogo's (alleen goedgekeurde; logo-render.js): klein, vaste maat, netjes afgekapt. Geen logo = geen element. */
    .jvo-logo { display: inline-flex; flex: none; line-height: 0; vertical-align: -3px; margin-right: 6px; }
    .jvo-logo img { border-radius: 22%; object-fit: cover; display: block; }
    .srow em .jvo-logo { vertical-align: -4px; }
    /* de naam-vakken hierboven stijlen élke span erin; het logo blijft een klein blokje vóór de naam */
    .tm .jvo-logo, .plek .jvo-logo, .sr .jvo-logo { display: inline-flex; overflow: visible; line-height: 0; }
    /* vaste links onderaan: Mijn team · Live · Regels (zelfde balk als op /mijn) */
    .onder { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--navy-2); border-top: 1.5px solid var(--rand); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
    .onder a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; border-radius: 14px; text-decoration: none; font: 600 11.5px var(--body); color: rgba(255,255,255,.88); }
    .onder a svg { width: 21px; height: 21px; }
    .onder a[aria-current="page"] { background: #fff; color: var(--navy); }
    .onder a:focus-visible { outline-offset: -3px; }
    .onder a[aria-current="page"]:focus-visible { outline-color: var(--navy); }
    .volg-melding:empty { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .kaart { transition: transform .2s ease; } .volg { transition: box-shadow .3s ease; }
      .ring-in img { transition: opacity .7s ease; }
      .ring-in { animation: ring-zweef 6s ease-in-out infinite; }
      @keyframes ring-zweef { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-3px); } }
    }

    /* ── breder dan een telefoon ─────────────────────────────────────────────── */
    @media (min-width: 700px) {
      .wrap { max-width: 800px; padding: 24px 24px 130px; }
      .onder { left: 50%; right: auto; bottom: 16px; width: 372px; transform: translateX(-50%); border: 1.5px solid var(--rand); border-radius: 22px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.4); }
      .hoofd { --ring: 128px; }
      .tabs { margin: 18px 0 0; padding: 0 0 4px; flex-wrap: wrap; overflow: visible; }
      .volg { max-width: 560px; }
      .list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
      .sporten { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sportvlak.veel .standen { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    }
    /* ── laptop en groter: kolommen naast elkaar ─────────────────────────────── */
    @media (min-width: 900px) {
      .wrap { max-width: 1280px; padding: 28px 32px 130px; }
      .hoofd { --ring: 156px; }
      h1 { font-size: 60px; margin-top: 38px; }
      .sub { font-size: 11px; margin-top: 14px; }
      .lbl { font-size: 11px; }
      .tab { font-size: 14px; }
      /* overzicht: "Straks" in twee kolommen onder de wedstrijden (de zijkolom komt vanaf 1180px) */
      .vlak > .v-zij .rijen, .sportvlak.veel .s-schema .rijen { column-count: 2; column-gap: 32px; }
      .rijen .sr { break-inside: avoid; }
      /* sportpagina: stand, schema en knock-out naast elkaar */
      .sportvlak { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; align-items: start; }
      .sportvlak > .s-ko, .sportvlak.veel > section, .sportvlak > section:only-child { grid-column: 1 / -1; }
      .sportvlak.veel > .s-stand { order: -1; }
    }
    @media (min-width: 1180px) {
      .hoofd { --ring: 168px; }
      h1 { font-size: 68px; }
      .list.breed { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      /* overzicht: links wat er nu speelt (raster) + de sporten, rechts "Straks" als zijkolom */
      .vlak { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 0 40px; align-items: start; }
      .vlak { grid-template-rows: auto 1fr; }
      .vlak.solo { grid-template-columns: minmax(0, 1fr); }
      .vlak > .v-zij { grid-column: 2; grid-row: 1 / span 2; }
      .vlak > .v-zij > .lbl:first-child { margin-top: 26px; }
      .vlak > .v-zij .rijen { column-count: auto; }
      .sportvlak.veel .standen { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .sportvlak { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
      .sportvlak > .s-ko, .sportvlak > section:only-child { grid-column: auto; }
      .sportvlak > .s-ko .list, .sportvlak > section .list { grid-template-columns: minmax(0, 1fr); }
      /* veel poules: de stand over de volle breedte (poules naast elkaar), daaronder schema | knock-out */
      .sportvlak.veel { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
      .sportvlak.veel > section { grid-column: auto; }
      .sportvlak.veel > .s-stand, .sportvlak.veel:not(.m-schema) > .s-ko, .sportvlak.veel:not(.m-ko) > .s-schema { grid-column: 1 / -1; }
      .sportvlak.veel.m-ko .s-schema .rijen { column-count: auto; }
      .sportvlak.veel.m-schema > .s-ko .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sportvlak.veel:not(.m-schema) > .s-ko .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
